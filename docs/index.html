<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פתקית</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="פתקית">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf7f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-v2-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-v2-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-v2-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-v2-180.png">
<link rel="apple-touch-icon" sizes="1024x1024" href="icon-v2-1024.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-v2-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@300;400;500;600&family=Heebo:wght@400;500&display=swap">
<script src="config.js"></script>
<style>
/* Layout: one phone-width column. Home = greeting with soft blob, pinned-note stack with arrows, folder grid, marked row.
   Bottom bar: separate + on the right, tabs beside it. Bottom sheets for adding and details.
   Palette: dusty rose base, navy "pen" ink, folder colors from the user's color codes. Deliberately light only. */
:root{
  color-scheme: light;
  --paper:#fbf7f0;
  --ink:#38406a; --muted:#9a95a8; --faint:#b9b4c4; --line:#ece4dc;
  --card:#ffffff; --accent:#d5708b; --accent-soft:#f8e1e7; --accent-ink:#fff;
  --mark:#f6c9d4; --ok:#8fb59b; --note:#fbeeb8;
  --l1:#f0b6c6; --l2:#f2dcbe; --l3:#e9b4b3; --l4:#eeceb6; --l5:#e49e91; --l6:#e3d3c6; --l7:#e6d3de; --l8:#dbe0ec;
  --blob1:#f2c6d2; --blob2:#f6e1cc;
  --f-hand:"Playpen Sans Hebrew","Heebo",cursive;
  --f-ui:"Heebo",system-ui,sans-serif;
  --radius:16px;
  --shadow:0 4px 18px rgba(120,80,80,.08);
}
body[data-tone="white"]{--paper:#ffffff;--line:#efe9e6}
body[data-tone="cream"]{--paper:#fbf7f0}
body[data-tone="beige"]{--paper:#f3ebe2;--line:#e5d9cc;--card:#fffbf7}

*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:25}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-hand);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:1.6rem;line-height:1.2}
h2{font-size:1.25rem}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.back{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;font-size:14px}
.small-btn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}

/* greeting */
.greet{position:relative;text-align:center;padding:30px 0 16px}
.blob{position:absolute;left:50%;top:-4px;width:170px;height:140px;transform:translateX(-50%);border-radius:48% 52% 46% 54% / 55% 45% 55% 45%;background:radial-gradient(circle at 40% 40%,var(--blob1),var(--blob2) 70%,transparent 72%);filter:blur(16px);opacity:.9;animation:breathe 8s ease-in-out infinite;pointer-events:none}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.08) rotate(10deg)}}
.greet h1{position:relative;font-size:1.9rem}
.greet p{position:relative;margin:2px 0 0;color:var(--muted);font-size:13px}

/* pinned note stack */
.pinned{display:flex;align-items:center;gap:8px;margin:12px 0 6px}
.arrow{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:14px;padding:0}
.arrow:disabled{opacity:.3}
.stack{position:relative;flex:1;min-width:0;padding-top:12px}
.stack .back-sheet{position:absolute;left:0;right:0;top:12px;bottom:0;border-radius:6px}
.stack .b2{background:var(--l4);transform:rotate(3deg) translate(-5px,7px)}
.stack .b1{background:var(--l1);transform:rotate(-2deg) translate(4px,4px);opacity:.85}
.note{position:relative;background:var(--note);border-radius:6px;padding:24px 16px 12px;min-height:168px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 16px rgba(80,60,40,.10)}
.note::before{content:"";position:absolute;top:0;left:0;right:0;height:20px;background:rgba(255,255,255,.35);border-radius:6px 6px 0 0}
.pin{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:3;width:18px;height:26px}
.note .content{font-family:var(--f-hand);font-size:15px;line-height:1.6;overflow-wrap:anywhere;flex:1}
.note .content p{margin:0}.note .content p+p{margin-top:6px}
.note .content b{font-weight:600}
.note .content[contenteditable="true"]{outline:2px dashed var(--accent);border-radius:8px;padding:6px 8px;background:rgba(255,255,255,.6);min-height:90px;-webkit-user-select:text;user-select:text}
.note-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.note-tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.note-tools button,.note-tools select{border:1px solid rgba(0,0,0,.07);background:rgba(255,255,255,.7);color:var(--ink);border-radius:8px;padding:3px 9px;font:inherit;font-size:12.5px}
.note-tools select{max-width:160px}
.note-tools button:disabled{opacity:.3}
.note-tools .go{background:var(--accent);color:#fff;border-color:var(--accent)}
.dots{display:flex;justify-content:center;align-items:center;gap:5px;margin:10px 0 20px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.dots .add-note{margin-inline-start:10px;border:0;background:none;color:var(--accent);font-size:13px;padding:2px 4px}
.ilink{display:inline-block;background:rgba(255,255,255,.85);border:1.5px solid var(--accent);color:var(--ink);border-radius:99px;padding:0 9px;text-decoration:none;font-size:.9em;cursor:pointer;margin:1px 0;font-family:var(--f-ui)}

/* folders */
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 2px 14px}
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
.folder{position:relative;min-width:0;border:0;background:var(--lc);border-radius:14px 0 14px 14px;padding:14px 14px 12px;min-height:112px;display:flex;flex-direction:column;gap:3px;text-align:right;color:var(--ink);transition:transform .15s;box-shadow:0 3px 10px rgba(120,80,70,.08)}
.folder::before{content:"";position:absolute;top:-10px;right:0;width:48%;height:14px;background:var(--lc);border-radius:10px 10px 0 0;filter:brightness(.95)}
.folder:active{transform:scale(.97)}
.folder .ic{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.55);display:grid;place-items:center}
.folder .nm{font-family:var(--f-hand);font-weight:500;font-size:15.5px;margin-top:4px}
.folder .pk{font-size:11.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .ct{position:absolute;top:10px;left:12px;font-family:var(--f-hand);font-size:22px;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.marked-row{margin-top:18px;display:flex;align-items:center;gap:10px;width:100%;border:1px dashed var(--faint);background:var(--card);border-radius:var(--radius);padding:13px 16px;text-align:right}
.hl{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%);padding:0 2px}
.marked-row .hl{font-family:var(--f-hand);font-weight:500}
.marked-row .n{margin-inline-start:auto;font-size:12px;color:var(--muted)}

/* list screen */
.l-head{position:relative;display:flex;align-items:center;gap:10px;margin:8px 0 2px}
.l-head .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--lc)}
.l-head h1{flex:1;min-width:0}
.sticker{position:absolute;left:4px;top:-8px;font-size:34px;transform:rotate(-12deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.12));pointer-events:none}
.l-tools{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.colors,.stickers{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid rgba(0,0,0,.06);padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.stk{font-size:24px;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0}
.stk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.section-label{font-size:12px;letter-spacing:.05em;color:var(--muted);margin:22px 2px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;padding:4px}
.items{list-style:none;margin:0;padding:0}
.it{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line);transition:opacity .4s}
.it .body{flex:1;min-width:0;text-align:right;border:0;background:none;padding:0;color:inherit}
.it .tx{font-family:var(--f-hand);font-size:16px;line-height:1.45;overflow-wrap:anywhere;display:inline}
.it .mt{font-size:10.5px;color:var(--faint);margin-top:3px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11.5px;border-radius:99px;padding:2px 9px;background:var(--accent-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.strong{background:var(--ink);color:#fff}
.chip.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.ck{flex:none;width:24px;height:24px;border-radius:8px;border:1.6px solid var(--faint);background:transparent;margin-top:2px;display:grid;place-items:center;padding:0}
.ck svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.6;stroke-dasharray:24;stroke-dashoffset:24}
.it.done .ck,.it.popping .ck,.it.rdone .ck{background:var(--accent);border-color:var(--accent)}
.it.done .ck svg,.it.popping .ck svg,.it.rdone .ck svg{stroke-dashoffset:0;transition:stroke-dashoffset .35s}
.it.popping .ck{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.it.popping .tx{text-decoration:line-through;text-decoration-color:var(--accent)}
@keyframes pop{40%{transform:scale(1.3)}}
.it.done{opacity:.45}.it.done .tx{text-decoration:line-through}.it.done .chips{display:none}
.it.rdone{opacity:.55}.it.rdone .chips .when{display:none}
.it.marked .tx{background:linear-gradient(transparent 52%,var(--mark) 52%,var(--mark) 92%,transparent 92%) no-repeat right/100% 100%;padding:0 2px}
.it.marked.anim .tx{background-size:0% 100%;animation:marker 1s .05s ease-out forwards}
@keyframes marker{to{background-size:100% 100%}}
.mk{flex:none;border:0;background:none;padding:3px;color:var(--faint);line-height:0}
.mk[aria-pressed="true"]{color:var(--accent)}
.it.flash,.env.flash{animation:flash 2s ease-out}
@keyframes flash{0%,55%{background:var(--accent-soft)}100%{background:transparent}}
.again{display:flex;gap:6px;flex-wrap:wrap}
.again button{border:1px dashed var(--faint);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.spark{position:fixed;pointer-events:none;font-size:15px;z-index:50;animation:fly .9s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}

/* future */
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.month{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 6px;text-align:center;font-size:13px;min-height:60px}
.month .yr{font-size:10.5px;color:var(--muted)}
.month .mdots{display:flex;justify-content:center;gap:3px;margin-top:4px;min-height:7px}
.month .mdots i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.month.has{background:var(--l2);border-color:transparent}
.env{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.env .body{flex:1;min-width:0;text-align:right;border:0;background:none;padding:0;color:inherit}
.env .hidden{filter:blur(6px);user-select:none}
.env .when{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* settings */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.status{font-size:13.5px;padding:8px 12px;border-radius:12px;background:var(--accent-soft)}
.status.good{background:#e3efe6}

/* bottom bar: + on the right, tabs beside it */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.nav-in{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:10px;pointer-events:auto}
.plus{flex:none;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 18px rgba(150,70,90,.25)}
.tabs{flex:1;display:flex;justify-content:space-around;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);padding:4px 16px;border-radius:12px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:500;background:var(--accent-soft)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,30,50,.3);z-index:30}
.sheet{position:fixed;inset:auto 0 0 0;z-index:31;background:var(--card);border-radius:24px 24px 0 0;max-height:90vh;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s ease-out}
.sheet-in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--muted)}
.field input[type=text],.field input[type=date],.field input[type=time],.field select{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--ink);width:100%;min-height:46px}
.field input[type=text]{font-family:var(--f-hand)}
.field textarea{font:inherit;font-size:16px;font-family:var(--f-hand);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--ink);width:100%;min-height:84px;resize:vertical;line-height:1.5}
.it .mt .has-desc{color:var(--muted)}
/* iOS Safari gives date/time inputs a fixed intrinsic width that overflows; let them shrink */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;box-sizing:border-box;text-align:right}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:right;margin:0}
.row input[type=date],.row input[type=time]{flex:1 1 120px;width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.icon-pick{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.icon-pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.toggle{display:flex;gap:10px;align-items:center;font-size:14.5px}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.save{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:13px;font-size:16px}
.ghost-btn{border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:10px 14px;font-size:15px}
.danger{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:8px 14px;font-size:14px}
.danger.solid{background:var(--accent);color:#fff}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.info{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.7;font-variant-numeric:tabular-nums}
.choose{display:grid;gap:10px}
.choose button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:14px;text-align:right;font-size:16px}
.choose button small{display:block;color:var(--muted);font-size:12.5px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.it.marked.anim .tx{background-size:100% 100%}}
</style>
</head>
<body data-tone="cream">
<div class="shell"><main id="screen"></main></div>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<div id="sheet"></div>

<script>
(function(){
const CFG=window.PITKIT_CONFIG||{};
const DAY=864e5;
const now=()=>new Date();
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=sod(d);x.setDate(x.getDate()+n);return x};
const diffDays=d=>Math.round((sod(d)-sod(now()))/DAY);
const pad=n=>String(n).padStart(2,'0');
const fDate=d=>{d=new Date(d);return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()};
const fShort=d=>{d=new Date(d);return d.getDate()+'.'+(d.getMonth()+1)};
const fTime=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fDT=d=>fDate(d)+' · '+fTime(d);
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const todayKey=()=>dayKey(now());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inDays=n=>n===0?'היום':n===1?'מחר':n===2?'בעוד יומיים':n<0?'עבר המועד':'בעוד '+n+' ימים';
const remWord=n=>n===1?'תזכורת אחת':n===2?'שתי תזכורות':n+' תזכורות';
const daysWord=n=>n===1?'יום':n===2?'יומיים':n+' ימים';
const iso=d=>new Date(d).toISOString();
const dInput=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const atNoon=v=>iso(new Date(v+'T12:00'));

/* ---------- icons (one line style) ---------- */
const IC={
  bottle:'<path d="M9 3h6v3H9z"/><path d="M8 9a2 2 0 0 1 2-3h4a2 2 0 0 1 2 3v10a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2z"/><path d="M8 13h8"/>',
  scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1 20 20M8.1 15.9 20 4"/>',

function sanitize(html){
  const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
  const walk=node=>{let out='';node.childNodes.forEach(c=>{
    if(c.nodeType===3){out+=esc(c.textContent);return}
    if(c.nodeType!==1)return;
    const tag=c.tagName;
    if(tag==='BR')out+='<br>';
    else if(tag==='B'||tag==='STRONG'||(c.style&&/bold|[6-9]00/.test(c.style.fontWeight)))out+='<b>'+walk(c)+'</b>';
    else if(tag==='A'&&c.dataset.item)out+=`<a class="ilink" data-item="${parseInt(c.dataset.item,10)}">${esc(c.textContent)}</a>`;
    else if(tag==='DIV'||tag==='P')out+='<br>'+walk(c);
    else out+=walk(c);
  });return out};
  return walk(doc.body.firstChild).replace(/^(<br>)+/,'').replace(/(<br>)+$/,'');
}

let lastRange=null;
document.addEventListener('selectionchange',()=>{
  const ed=document.querySelector('.content[contenteditable="true"]');const s=getSelection();

});
function restoreRange(ed){
  const cur=getSelection();
  if(cur.rangeCount&&ed.contains(cur.getRangeAt(0).commonAncestorContainer))return;
  ed.focus();const s=getSelection();s.removeAllRanges();
  if(lastRange&&ed.contains(lastRange.commonAncestorContainer))s.addRange(lastRange);
  else{const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);s.addRange(r)}
}

}

  if(rem.length) lines.push(`היום יש לך ${remWord(rem.length)}.`);

  if(!pushSupported())return {cls:'',text:'הדפדפן הזה לא תומך בהתראות.'};
  if(Notification.permission==='denied')return {cls:'',text:'ההתראות חסומות. אפשר להפעיל אותן בהגדרות האייפון ← התראות ← פתקית.'};

/* ---------- notifications schedule ---------- */
function buildSchedule(){
  const out=[];const N=Date.now();const H=settings.remindTime||'10:00';
  const at=(date,hm)=>{const [h,m]=hm.split(':');const d=new Date(date);d.setHours(+h,+m,0,0);return d.getTime()};
  const add=(t,title,body,id,tag)=>{if(t>N)out.push({at:t,title,body,url:'./?item='+id,tag})};
  for(const i of items){
    if(!isOpen(i))continue;const d=D(i.drawer);if(!d)continue;const title=d.name;
    if(d.type==='deadline'&&i.deadline){
      const dl=new Date(i.deadline),rem=remindOn(i);
      if(i.early)add(at(addDays(dl,-30),H),title,`בעוד חודש, עד ${fShort(dl)}: ${i.text}. יש זמן להתכונן 🌿`,i.id,'e'+i.id);
      add(at(rem,H),title,`היי 💗 ${i.before===0?'היום':'בעוד '+daysWord(i.before)} (עד ${fShort(dl)}): ${i.text}`,i.id,'r'+i.id);
      if(i.nag){for(let k=1;;k++){const day=addDays(rem,k);const dd=Math.round((day-sod(dl))/DAY);if(dd>3||k>45)break;
        add(at(day,H),title,dd<0?`רק מזכירה שוב: ${i.text} (עד ${fShort(dl)})`:dd===0?`היום היום האחרון: ${i.text} 💗`:`עוד לא סימנת: ${i.text}. אם כבר טיפלת, אפשר לסמן ✓`,i.id,'n'+i.id)}}
      else if(sod(rem)<sod(dl))add(at(dl,H),title,`היום היום האחרון: ${i.text} 💗`,i.id,'d'+i.id);
    }
    if(d.type==='reminder'&&i.date){
      const t=remindAt(i);
      if(i.dayBefore)add(t.getTime()-DAY,title,`מחר בשעה ${i.time}: ${i.text}`,i.id,'b'+i.id);
      add(t.getTime(),title,`היי 💗 ${i.text}`,i.id,'m'+i.id);
    }
    if(d.type==='routine'){
      for(let k=0;k<21;k++){const day=addDays(now(),k);if(k===0&&isRoutineDone(i))continue;
        for(const t of i.times||[])add(at(day,t),title,`הגיע הזמן: ${i.text} 💗`,i.id,'t'+i.id)}
    }
    if(d.type==='capsule'&&i.target){
      add(at(addDays(i.target,-30),H),'עתידי: עוד חודש',`ל־${fDate(i.target)}: ${i.text}`,i.id,'c'+i.id);
      add(at(i.target,H),'עתידי: היום זה היום',i.text,i.id,'C'+i.id);
    }
  }
  return out.sort((a,b)=>a.at-b.at).slice(0,700);
}
let syncTimer=null;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500)}
async function syncNow(){
  if(!CFG.pushUrl||!push.subscription)return;
  try{
    const r=await fetch(CFG.pushUrl.replace(/\/$/,'')+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:push.device,subscription:push.subscription,schedule:buildSchedule()})});
    if(!r.ok)throw new Error('שגיאה '+r.status);
    push.lastSync=iso(now());push.lastError=null;
  }catch(e){push.lastError='לא הצלחתי לעדכן את השרת. אנסה שוב בפעם הבאה שתפתחי.'}
  persist();if(ui.view==='settings')render();
}
const b64ToBytes=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function enablePush(){
  ui.msg=null;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ui.msg='לא אישרת התראות. אפשר לנסות שוב מתי שתרצי.';render();return}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(CFG.vapidPublic)});
    push.subscription=sub.toJSON();persist();
    await syncNow();ui.msg='מעולה! מעכשיו התזכורות יגיעו לטלפון 💗';
  }catch(e){ui.msg='משהו לא הסתדר בהפעלה: '+e.message}
  render();
}
async function testPush(){
  try{
    await syncNow();
    const r=await fetch(CFG.pushUrl.replace(/\/$/,'')+'/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:push.device})});
    const j=await r.json();ui.msg=j.ok?'נשלחה התראת ניסיון. היא אמורה להגיע תוך כמה שניות.':'השליחה לא הצליחה ('+(j.status||j.error)+'). אולי צריך להפעיל התראות מחדש.';
    if(!j.ok&&(j.status===404||j.status===410)){push.subscription=null;persist()}
  }catch(e){ui.msg='לא הצלחתי להגיע לשרת.'}
  render();
}
async function exportBackup(){
  const data=JSON.stringify({app:'pitkit',version:2,exported:iso(now()),items,notes,custom,drawerColors,stickers,bought,settings},null,1);
  const name='pitkit-'+dInput(now())+'.json';
  const file=new File([data],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'גיבוי פתקית'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
}

    ${extra}
    <button type="button" class="save" data-act="saveItem">${it?'לשמור שינויים':'לשמור'}</button>
    ${it?(s.confirmDelete?`<div class="row"><span>למחוק לגמרי?</span><button type="button" class="danger solid" data-act="deleteItem">כן, למחוק</button><button type="button" class="linkbtn" data-act="keepItem">לא</button></div>`:`<button type="button" class="danger" data-act="askDeleteItem">מחיקה</button>`):''}`);
  if(!s.focused){s.focused=true;if(!it)setTimeout(()=>document.getElementById('f-text')?.focus(),50)}
}
function readSheet(){
  const s=ui.sheet;if(!s)return;
  const v=id=>document.getElementById(id);
  const map={'f-dname':'name','f-text':'text','f-deadline':'deadline','f-before':'before','f-t1':'t1','f-t2':'t2','f-target':'target','f-date':'date','f-time':'time','f-desc':'desc'};
  for(const id in map)if(v(id))s[map[id]]=v(id).value;
  for(const [id,k] of [['f-early','early'],['f-nag','nag'],['f-track','track'],['f-dayBefore','dayBefore']])if(v(id))s[k]=v(id).checked;
}
function openItemSheet(item){
  const tomorrow=dInput(addDays(now(),1));
  if(item){
    ui.sheet={kind:'item',editId:item.id,drawer:item.drawer,text:item.text,desc:item.desc||'',deadline:dInput(item.deadline||addDays(now(),14)),before:item.before??2,early:!!item.early,nag:item.nag??true,
      t1:(item.times||[])[0]||'09:00',t2:(item.times||[])[1]||'',track:!!item.track,target:dInput(item.target||now()),date:item.date||tomorrow,time:item.time||'10:00',dayBefore:!!item.dayBefore};
  }else{
    const dr=ui.view==='drawer'?ui.drawer:ui.view==='capsule'?'capsule':'pharm';
    ui.sheet={kind:'item',drawer:dr,text:'',desc:'',deadline:dInput(addDays(now(),14)),before:2,early:false,nag:true,t1:'09:00',t2:'',track:false,target:dInput(now()),date:tomorrow,time:'10:00',dayBefore:false};
  }
  renderSheet();
}
function saveItem(){
  readSheet();const s=ui.sheet,d=D(s.drawer);
  const need=id=>{document.getElementById(id)?.focus()};
  if(!s.text.trim()){const t=document.getElementById('f-text');t.focus();t.placeholder='צריך לכתוב משהו קטן 🙂';return}
  if(d.type==='deadline'&&!s.deadline)return need('f-deadline');
  if(d.type==='capsule'&&!s.target)return need('f-target');
  if(d.type==='reminder'&&!s.date)return need('f-date');
  if(d.type==='routine'&&!s.t1&&!s.t2)return need('f-t1');
  let o=s.editId!=null?items.find(i=>i.id===s.editId):null;
  if(!o){o={id:nextId(items),created:iso(now()),done:false,archived:false,love:false};items.push(o)}
  o.drawer=d.id;o.text=s.text.trim();
  if((s.desc||'').trim())o.desc=s.desc.trim();else delete o.desc;
  ['deadline','before','early','nag','times','target','date','time','dayBefore'].forEach(k=>delete o[k]);
  if(d.type==='deadline')Object.assign(o,{deadline:atNoon(s.deadline),before:+s.before,early:s.early,nag:s.nag});
  if(d.type==='reminder')Object.assign(o,{date:s.date,time:s.time||'10:00',dayBefore:s.dayBefore});
  if(d.type==='routine')Object.assign(o,{times:[s.t1,s.t2].filter(Boolean).sort(),track:s.track,streak:o.streak||0});
  if(d.type==='capsule')Object.assign(o,{target:atNoon(s.target)});
  ui.sheet=null;ui.view=d.type==='capsule'?'capsule':'drawer';ui.drawer=d.id;ui.tool=null;
  save();render();renderSheet();
}
function saveDrawer(){
  readSheet();const s=ui.sheet;
  if(!s.name.trim()){const t=document.getElementById('f-dname');t.focus();t.placeholder='צריך שם קטן 🙂';return}
  const id='d'+Date.now();
  custom.push({id,name:s.name.trim(),icon:s.icon,color:s.color,type:s.type,custom:true});
  syncDrawers();ui.sheet=null;ui.view='drawer';ui.drawer=id;ui.confirmDel=false;ui.tool=null;
  save();render();renderSheet();scrollTo(0,0);
}

/* ---------- interactions ---------- */
function sparkle(btn){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=btn.getBoundingClientRect();const set=['✨','💗','🌸','✨','💕'];
  for(let k=0;k<7;k++){const s=document.createElement('span');s.className='spark';s.textContent=set[k%set.length];
    const a=Math.random()*Math.PI*2,dist=34+Math.random()*34;
    s.style.left=(r.left+r.width/2-8)+'px';s.style.top=(r.top+r.height/2-10)+'px';
    s.style.setProperty('--dx',Math.cos(a)*dist+'px');s.style.setProperty('--dy',Math.sin(a)*dist-18+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),950)}
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
}
function rememberBought(i){
  const d=D(i.drawer);if(!d||d.type!=='list')return;
  const list=(bought[d.id]||[]).filter(x=>x!==i.text);list.unshift(i.text);bought[d.id]=list.slice(0,12);
}
function check(id,btn){
  const i=items.find(x=>x.id==id);const d=D(i.drawer);const row=btn.closest('.it,.env');
  if(d.type==='routine'){
    if(isRoutineDone(i)){i.doneDate=null;i.lastDone=i.prevLastDone||null;i.streak=i.prevStreak||0;save();render();return}
    row.classList.add('popping');sparkle(btn);
    setTimeout(()=>{const y=dayKey(addDays(now(),-1));i.prevLastDone=i.lastDone||null;i.prevStreak=i.streak||0;i.streak=(i.lastDone===y?(i.streak||0):0)+1;i.lastDone=todayKey();i.doneDate=todayKey();save();render()},600);return;
  }
  if(i.done){i.done=false;i.archived=false;i.doneAt=null;save();render();return}
  row.classList.add('popping');sparkle(btn);
  setTimeout(()=>{i.done=true;i.doneAt=iso(now());rememberBought(i);save();render()},650);
}
function liveDraft(){const ed=document.querySelector('.content[contenteditable="true"]');if(ed&&ui.editNote!=null)ui.draft=ed.innerHTML}
function closeEditor(keep){
  const n=notes.find(x=>x.id===ui.editNote);
  if(n){if(keep){const ed=document.getElementById('ed-'+n.id);if(ed)n.html=sanitize(ed.innerHTML)}if(!n.html.replace(/<br>|&nbsp;|\s/g,''))notes=notes.filter(x=>x!==n)}
  ui.editNote=null;ui.draft=null;persist();render();
}
function addNote(scope){
  if(ui.editNote!=null)closeEditor(true);
  const id=nextId(notes);notes.push({id,scope,html:'',created:iso(now())});ui.editNote=id;ui.draft=null;render();focusEditor(id);
}
let pendingImport=null;
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-act="bold"]'))e.preventDefault()});
document.addEventListener('change',async e=>{
  if(e.target.id==='linkpick'&&e.target.value){insertLink(e.target.value);e.target.value='';return}
  if(e.target.id==='f-remindTime'){settings.remindTime=e.target.value||'10:00';save();return}
  if(e.target.id==='importFile'&&e.target.files[0]){
    try{const j=JSON.parse(await e.target.files[0].text());if(j.app!=='pitkit'||!Array.isArray(j.items))throw 0;pendingImport=j;ui.confirmImport=true;ui.msg=null}
    catch(err){ui.msg='הקובץ הזה לא נראה כמו גיבוי של פתקית.'}
    render();return;
  }
  if(ui.sheet&&e.target.closest('.sheet'))readSheet();
});
document.addEventListener('input',e=>{if(ui.sheet&&e.target.closest('.sheet'))readSheet()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.sheet){ui.sheet=null;renderSheet()}
  if(e.key==='Enter'&&e.target.id==='f-text'){e.preventDefault();saveItem()}
  if(e.key==='Enter'&&e.target.id==='f-dname'){e.preventDefault();saveDrawer()}
});
document.addEventListener('click',e=>{
  const lk=e.target.closest('.ilink');
  if(lk&&!lk.closest('[contenteditable="true"]')){e.preventDefault();goItem(lk.dataset.item);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  switch(a){
  case 'tone':settings.tone=b.dataset.v;persist();applyLook();render();return;
  case 'enablePush':enablePush();return;
  case 'testPush':testPush();return;
  case 'syncNow':syncNow().then(()=>{ui.msg=push.lastError||'עודכן 💗';render()});return;
  case 'export':exportBackup();return;
  case 'doImport':if(pendingImport){const j=pendingImport;items=j.items;notes=j.notes||[];custom=(j.custom||[]).map(c=>Object.assign({icon:'star'},c,{color:OLD_COLORS[c.color]||c.color}));drawerColors=j.drawerColors||{};stickers=j.stickers||{};bought=j.bought||{};settings=Object.assign({},DEFAULTS,j.settings||{});syncDrawers();pendingImport=null;ui.confirmImport=null;ui.msg='הגיבוי שוחזר 💗';save();applyLook();render()}return;
  case 'cancelImport':pendingImport=null;ui.confirmImport=null;render();return;
  case 'tool':ui.tool=ui.tool===b.dataset.v?null:b.dataset.v;render();return;
  case 'setColor':drawerColors[ui.drawer]=b.dataset.v;syncDrawers();persist();render();return;
  case 'setSticker':if(b.dataset.v)stickers[ui.drawer]=b.dataset.v;else delete stickers[ui.drawer];ui.tool=null;persist();render();return;
  case 'noteNav':{const sc=b.dataset.scope;if(ui.editNote!=null)closeEditor(true);ui.noteIdx[sc]=(ui.noteIdx[sc]||0)+(+b.dataset.dir);ui.confirmNote=null;render();return}
  case 'addNote':addNote(b.dataset.scope);return;
  case 'editNote':if(ui.editNote!=null)closeEditor(true);ui.editNote=+b.dataset.id;ui.draft=null;ui.confirmNote=null;render();focusEditor(ui.editNote);return;
  case 'bold':{const ed=document.querySelector('.content[contenteditable="true"]');if(ed){restoreRange(ed);document.execCommand('bold')}return}
  case 'saveNote':closeEditor(true);return;
  case 'cancelNote':closeEditor(false);return;
  case 'moveNote':{const n=notes.find(x=>x.id==b.dataset.id);const list=notes.filter(x=>x.scope===n.scope);const k=list.indexOf(n);if(k<1)return;const ia=notes.indexOf(n),ib=notes.indexOf(list[k-1]);[notes[ia],notes[ib]]=[notes[ib],notes[ia]];ui.noteIdx[n.scope]=Math.max(0,(ui.noteIdx[n.scope]||0)-1);persist();render();return}
  case 'askDelNote':ui.confirmNote=+b.dataset.id;render();return;
  case 'keepNote':ui.confirmNote=null;render();return;
  case 'delNote':notes=notes.filter(x=>x.id!=b.dataset.id);ui.confirmNote=null;persist();render();return;
  case 'home':ui.view='home';ui.tool=null;render();scrollTo(0,0);return;
  case 'nav':ui.view=b.dataset.view;ui.msg=null;render();scrollTo(0,0);return;
  case 'drawer':{const id=b.dataset.id;if(id==='capsule'){ui.view='capsule'}else{ui.view='drawer';ui.drawer=id;ui.showArchive=false;ui.confirmDel=false;ui.tool=null}render();scrollTo(0,0);return}
  case 'check':check(b.dataset.id,b);return;
  case 'love':{const i=items.find(x=>x.id==b.dataset.id);i.love=!i.love;ui.justMarked=i.love?i.id:null;persist();render();setTimeout(()=>{ui.justMarked=null},1200);return}
  case 'editItem':openItemSheet(items.find(x=>x.id==b.dataset.id));return;
  case 'askDeleteItem':readSheet();ui.sheet.confirmDelete=true;renderSheet();return;
  case 'keepItem':ui.sheet.confirmDelete=false;renderSheet();return;
  case 'deleteItem':items=items.filter(i=>i.id!==ui.sheet.editId);ui.sheet=null;save();render();renderSheet();return;
  case 'again':items.push({id:nextId(items),drawer:ui.drawer,text:b.dataset.text,created:iso(now()),done:false,archived:false,love:false});save();render();return;
  case 'archive':items.forEach(i=>{if(i.drawer===ui.drawer&&i.done)i.archived=true});persist();render();return;
  case 'toggleArch':ui.showArchive=!ui.showArchive;render();return;
  case 'peek':ui.peek[b.dataset.id]=!ui.peek[b.dataset.id];render();return;
  case 'month':ui.highlight=b.dataset.key;render();document.getElementById('m-'+b.dataset.key)?.scrollIntoView({behavior:'smooth',block:'center'});return;
  case 'add':if(ui.view==='drawer'||ui.view==='capsule'){openItemSheet();return}ui.sheet={kind:'choose'};renderSheet();return;
  case 'chooseItem':openItemSheet();return;
  case 'chooseList':ui.sheet={kind:'list',name:'',icon:'gift',color:'--l1',type:'list'};renderSheet();return;
  case 'chooseNote':{ui.sheet=null;renderSheet();const scope=ui.view==='drawer'?ui.drawer:ui.view==='capsule'?'capsule':'home';if(ui.view!=='drawer'&&ui.view!=='capsule')ui.view='home';addNote(scope);scrollTo(0,0);return}
  case 'close':ui.sheet=null;renderSheet();return;
  case 'sheetDrawer':readSheet();ui.sheet.drawer=b.dataset.id;renderSheet();return;
  case 'saveItem':saveItem();return;
  case 'pickIcon':case 'pickColor':case 'pickType':readSheet();ui.sheet[{pickIcon:'icon',pickColor:'color',pickType:'type'}[a]]=b.dataset.v;renderSheet();return;
  case 'saveDrawer':saveDrawer();return;
  case 'askDel':ui.confirmDel=true;render();return;
  case 'cancelDel':ui.confirmDel=false;render();return;
  case 'delDrawer':{const id=ui.drawer;custom=custom.filter(c=>c.id!==id);items=items.filter(i=>i.drawer!==id);notes=notes.filter(n=>n.scope!==id);delete drawerColors[id];delete stickers[id];delete bought[id];syncDrawers();ui.confirmDel=false;ui.view='home';save();render();scrollTo(0,0);return}
  }
});

function applyLook(){
  document.body.dataset.tone=settings.tone;
  const bar=getComputedStyle(document.body).getPropertyValue('--paper').trim()||'#fbf7f0';
  document.querySelector('meta[name="theme-color"]').setAttribute('content',bar);
}
function render(){
  liveDraft();
  const v=ui.view;
  document.getElementById('screen').innerHTML=v==='drawer'?renderDrawer():v==='capsule'?renderCapsule():v==='fav'?renderFav():v==='settings'?renderSettings():renderHome();
  const cur=v==='settings'?'settings':'home';
  document.getElementById('nav').innerHTML=`
    <button type="button" class="plus" data-act="add" aria-label="להוסיף">+</button>
    <div class="tabs"><button type="button" data-act="nav" data-view="home" ${cur==='home'?'aria-current="page"':''}>${svg('house')}בית</button>
    <button type="button" data-act="nav" data-view="settings" ${cur==='settings'?'aria-current="page"':''}>${svg('gear')}הגדרות</button></div>`;
}
function openFromUrl(u){
  try{const id=new URL(u,location.href).searchParams.get('item');if(id){history.replaceState(null,'',location.pathname);setTimeout(()=>goItem(+id),50)}}catch(e){}
}

window.__pitkit={buildSchedule}; // for debugging from the console
applyLook();render();
openFromUrl(location.href);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='open')openFromUrl(e.data.url)});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!ui.sheet&&ui.editNote==null)render();scheduleSync()}});
scheduleSync();
})();
</script>
