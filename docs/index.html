<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פתקית</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="פתקית">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf6e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Rubik:wght@400;500;700&family=Amatic+SC:wght@700&family=Secular+One&family=Playpen+Sans+Hebrew:wght@400;600&display=swap">
<script src="config.js"></script>
<style>
/* Layout: one phone-width column, topics as a 2-up grid, sticky notes carousel, bottom tab bar, bottom sheet for editing.
   Three looks redefine the same tokens; each is a deliberate light world. */
:root{
  color-scheme: light;
  --bg:#fbe9e7;
  --card:rgba(255,255,255,.86); --card-solid:#fff;
  --ink:#4b3a55; --muted:#8c7b94; --line:#ecdfe9;
  --accent:#e07aa5; --accent-soft:#fbe0ec; --accent-ink:#fff;
  --ok:#5fb38a;
  --c1:#ffd6e2; --c2:#d4f2e4; --c3:#ffe3c9; --c4:#dcd8fb; --c5:#d6ecfb; --c6:#fff1b8; --c7:#f7d2ef; --c8:#e8e1d3;
  --f-display:"Varela Round","Rubik",system-ui,sans-serif;
  --f-body:"Varela Round","Rubik",system-ui,sans-serif;
  --f-size-display:1.7rem;
  --radius:22px; --radius-sm:14px;
  --shadow:0 6px 22px rgba(160,100,140,.14);
  --border:1px solid rgba(255,255,255,.9);
  --page-bg: radial-gradient(circle at 85% 0%, #ffd9e6 0, transparent 55%),
             radial-gradient(circle at 0% 30%, #e6defc 0, transparent 50%),
             radial-gradient(circle at 70% 100%, #d9f3ea 0, transparent 50%), #fdf0ee;
  --bar:#fdf0ee;
  --tilt:0deg;
  --pink:#ee5c9c; --pink-soft:#ffe1ee;
}
body[data-look="notebook"]{
  --card:transparent; --card-solid:#fffdf6;
  --ink:#2c3a63; --muted:#7a86a6; --line:#cfdcef;
  --accent:#d9534f; --accent-soft:#fbe3df; --accent-ink:#fff;
  --c1:#ffd9d6; --c2:#d9efd8; --c3:#ffe6c2; --c4:#e0dcf7; --c5:#d5e8f7; --c6:#fff3a6;
  --f-display:"Amatic SC","Rubik",cursive; --f-size-display:2.4rem;
  --f-body:"Rubik",system-ui,sans-serif;
  --radius:4px; --radius-sm:4px; --shadow:none; --border:0;
  --paper:#fbf6e8; --bar:var(--paper);
  --page-bg: linear-gradient(to left, transparent 30px, #f1a7a3 30px, #f1a7a3 32px, transparent 32px),
             repeating-linear-gradient(to bottom, transparent 0 31px, #d7e3f3 31px 32px), var(--paper);
}
body[data-look="notebook"][data-tone="white"]{--paper:#ffffff}
body[data-look="notebook"][data-tone="cream"]{--paper:#fbf6e8}
body[data-look="notebook"][data-tone="yellow"]{--paper:#fff5c4}
body[data-look="notebook"][data-pattern="grid"]{--page-bg: linear-gradient(#d3dff1 1px, transparent 1px) 0 0/24px 24px, linear-gradient(90deg, #d3dff1 1px, transparent 1px) 0 0/24px 24px, var(--paper)}
body[data-look="notebook"][data-pattern="dots"]{--page-bg: radial-gradient(circle, #b4c3dc 1.4px, transparent 1.9px) 0 0/22px 22px, var(--paper)}
body[data-look="notebook"][data-pattern="blank"]{--page-bg: var(--paper)}
body[data-look="stickers"]{
  --card:#fff; --card-solid:#fff;
  --ink:#24324a; --muted:#5c6b80; --line:#24324a;
  --accent:#ff6f91; --accent-soft:#ffe0e8; --accent-ink:#fff;
  --c1:#ffb3c7; --c2:#9fe8c4; --c3:#ffcf99; --c4:#c3b8ff; --c5:#a8dcff; --c6:#ffe36e;
  --f-display:"Secular One","Rubik",sans-serif; --f-size-display:1.8rem;
  --f-body:"Rubik",system-ui,sans-serif;
  --radius:18px; --radius-sm:12px;
  --shadow:3px 4px 0 #24324a; --border:2px solid #24324a;
  --page-bg: radial-gradient(#ffffff99 2px, transparent 2.5px) 0 0/22px 22px, #c9f0e1;
  --bar:#c9f0e1;
  --tilt:-1.2deg;
}
body[data-hand="round"]{--f-body:"Playpen Sans Hebrew","Amatic SC","Rubik",cursive}
body[data-hand="narrow"]{--f-body:"Amatic SC","Rubik",cursive;font-size:20px}

*{box-sizing:border-box}
html{background:var(--bar)}
body{margin:0;min-height:100vh;background:var(--page-bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:25}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}

h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:var(--f-size-display);line-height:1.15}
h2{font-size:calc(var(--f-size-display)*.8)}
body[data-look="notebook"] h1,body[data-look="notebook"] h2{font-weight:700}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.date-today{color:var(--muted);font-size:13px}
.back{background:var(--card);border-radius:99px;padding:6px 14px;box-shadow:var(--shadow);border:var(--border)}
body[data-look="notebook"] .back{background:var(--card-solid);border:1px solid var(--line)}

.bubble{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:var(--border);box-shadow:var(--shadow);border-radius:var(--radius);padding:14px 16px;margin:8px 0 20px}
.bubble .face{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:20px}
.bubble p{margin:0}
.bubble p+p{margin-top:4px}
body[data-look="notebook"] .bubble{background:var(--c6);transform:rotate(-1deg);border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.06)}

/* topics grid */
.drawers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drawer{position:relative;text-align:right;border:var(--border);background:var(--dc);border-radius:var(--radius);padding:14px;min-height:118px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:transform .15s}
.drawer:nth-child(odd){transform:rotate(var(--tilt))}
.drawer:nth-child(even){transform:rotate(calc(var(--tilt) * -1))}
.drawer:active{transform:scale(.97)}
.drawer .emo{font-size:26px;line-height:1}
.drawer .name{font-weight:500;font-size:16px}
.drawer .peek{font-size:12.5px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .count{position:absolute;top:12px;left:12px;background:var(--card-solid);border-radius:99px;font-size:12px;padding:1px 9px;font-variant-numeric:tabular-nums}
body[data-look="notebook"] .drawer{border-radius:2px;box-shadow:0 3px 0 rgba(44,58,99,.08);border-top:14px solid rgba(255,255,255,.55)}
.drawer.new{background:transparent;border:2px dashed var(--muted);box-shadow:none;align-items:center;justify-content:center;color:var(--muted)}
.drawer.new .emo{font-size:30px}

/* items */
.section-label{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;padding:4px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:var(--border);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow);position:relative;transition:opacity .4s}
body[data-look="notebook"] .item{background:transparent;box-shadow:none;border-bottom:1px solid var(--line);border-radius:0;padding:10px 4px}
.item .body{flex:1;min-width:0;text-align:right;border:0;background:none;padding:0}
.item .text{font-size:16px;overflow-wrap:anywhere}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border-radius:99px;padding:3px 10px;background:var(--dc,var(--accent-soft));font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.strong{background:var(--accent);color:var(--accent-ink)}
.chip.ghost{background:transparent;border:1px solid var(--line)}
body[data-look="stickers"] .chip{border:1.5px solid var(--ink)}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.check svg{width:16px;height:16px;stroke:var(--accent-ink);stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24}
.item.done .check,.item.popping .check,.item.routine-done .check{background:var(--ok);border-color:var(--ok)}
.item.done .check svg,.item.popping .check svg,.item.routine-done .check svg{stroke-dashoffset:0;transition:stroke-dashoffset .35s .05s}
.item.popping .check{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.item.popping .text{text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:2px}
.item.done{opacity:.5}
.item.done .text{text-decoration:line-through;text-decoration-thickness:1.5px}
.item.done .chips{display:none}
.item.routine-done{opacity:.6}
.item.routine-done .chips .when{display:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.heart{flex:none;border:0;background:none;padding:2px 4px;line-height:1;font-size:20px;opacity:.28;filter:saturate(.5);transition:transform .2s,opacity .2s}
.heart[aria-pressed="true"]{opacity:1;filter:none}
.heart:active{transform:scale(1.3)}
.item.flash,.envelope.flash{animation:flash 2s ease-out}
@keyframes flash{0%,55%{box-shadow:0 0 0 4px var(--pink)}100%{box-shadow:0 0 0 0 transparent}}
.spark{position:fixed;pointer-events:none;font-size:16px;z-index:50;animation:fly .9s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.again{display:flex;gap:8px;flex-wrap:wrap}
.again button{border:1px dashed var(--muted);background:var(--card-solid);border-radius:99px;padding:6px 12px;font-size:13.5px}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:14px}

body[data-hand="narrow"] .item .text{font-size:23px;font-weight:700;line-height:1.2}
body[data-hand="narrow"] .item .meta,body[data-hand="narrow"] .chip,body[data-hand="narrow"] .date-today,body[data-hand="narrow"] .drawer .peek,body[data-hand="narrow"] .hint,body[data-hand="narrow"] .field>span{font-size:17px;font-weight:700}
body[data-hand="narrow"] .drawer .name{font-size:22px;font-weight:700}
body[data-hand="round"] .item .text{font-size:16.5px}

/* favorites pill */
.fav-pill{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--pink-soft);color:var(--ink);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;text-align:right;font-size:15px}
.fav-pill>span:first-child{font-size:19px}
.fav-pill .n{margin-inline-start:auto;background:var(--pink);color:#fff;border-radius:99px;padding:1px 10px;font-size:13px}
.from{font-size:12px;color:var(--muted);margin:14px 4px 6px}

/* sticky notes */
.notes{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 16px;margin:4px 0 8px;align-items:stretch;-webkit-overflow-scrolling:touch}
.note{flex:0 0 84%;scroll-snap-align:center;background:var(--note-bg,var(--c6));border:var(--border);box-shadow:var(--shadow);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:120px;min-width:0}
.note:nth-child(3n+2){--note-bg:var(--pink-soft)}
.note:nth-child(3n){--note-bg:var(--c5)}
.note.assistant{--note-bg:var(--card-solid);flex-direction:row;align-items:flex-start;gap:10px}
.note.assistant .face{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:20px}
.note.assistant p{margin:0}.note.assistant p+p{margin-top:4px}
body[data-look="notebook"] .note{border-radius:2px;transform:rotate(-1deg);box-shadow:0 2px 0 rgba(0,0,0,.06)}
body[data-look="notebook"] .note:nth-child(even){transform:rotate(1deg)}
body[data-look="notebook"] .note.assistant{--note-bg:var(--c6)}
.note .content{flex:1;overflow-wrap:anywhere;min-height:40px}
.note .content[contenteditable="true"]{outline:2px dashed var(--pink);border-radius:8px;padding:6px 8px;background:rgba(255,255,255,.65);min-height:80px;-webkit-user-select:text;user-select:text}
.note .stamp{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.note-tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.note-tools button,.note-tools select{border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.7);color:var(--ink);border-radius:8px;padding:4px 9px;font:inherit;font-size:13px}
.note-tools select{max-width:170px}
.note-tools button:disabled{opacity:.3}
.note-tools .go{background:var(--pink);color:#fff;border-color:var(--pink)}
.note-add{flex:0 0 74px;border:2px dashed var(--muted);border-radius:var(--radius);background:transparent;color:var(--muted);font-size:13px;line-height:1.3}
.ilink{display:inline-block;background:rgba(255,255,255,.85);border:1.5px solid var(--pink);color:var(--ink);border-radius:99px;padding:0 9px;text-decoration:none;font-size:.92em;cursor:pointer;margin:1px 0}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.icon-btn{border:var(--border);background:var(--card-solid);border-radius:99px;padding:5px 12px;font-size:13px;box-shadow:var(--shadow)}
body[data-look="notebook"] .icon-btn{border:1px solid var(--line)}

/* capsule */
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.month{border:var(--border);background:var(--card);border-radius:var(--radius-sm);padding:8px 6px;text-align:center;font-size:13px;min-height:62px;box-shadow:var(--shadow)}
body[data-look="notebook"] .month{background:var(--card-solid);border:1px solid var(--line)}
.month .yr{font-size:10.5px;color:var(--muted)}
.month .dots{display:flex;justify-content:center;gap:3px;margin-top:4px;min-height:8px}
.month .dots i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.month.has{background:var(--c6)}
.envelope{background:var(--c6);border:var(--border);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.envelope .seal{font-size:26px}
.envelope .body{flex:1;min-width:0;text-align:right;border:0;background:none;padding:0}
.envelope .hidden-text{filter:blur(6px);user-select:none}
.envelope .when{font-size:12.5px;opacity:.75;font-variant-numeric:tabular-nums}

/* settings */
.panel{background:var(--card-solid);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
body[data-look="notebook"] .panel{border:1px solid var(--line)}
.panel h2{font-size:calc(var(--f-size-display)*.7)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 13px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card-solid);border-color:var(--ink)}
.status{font-size:13.5px;padding:8px 12px;border-radius:12px;background:var(--accent-soft)}
.status.good{background:#dff3e8}

/* bottom nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none}
.nav-inner{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--card-solid);border:var(--border);box-shadow:0 8px 30px rgba(80,50,90,.18);border-radius:99px;padding:6px}
body[data-look="notebook"] .nav-inner{border:1px solid var(--line)}
.nav-inner button{border:0;background:none;border-radius:99px;padding:8px 13px;font-size:14px;white-space:nowrap}
.nav-inner button[aria-current="page"]{background:var(--accent-soft)}
.nav-inner .add{background:var(--accent);color:var(--accent-ink);font-size:22px;width:46px;height:46px;padding:0;display:grid;place-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,25,50,.35);z-index:30}
.sheet{position:fixed;inset:auto 0 0 0;z-index:31;background:var(--card-solid);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s ease-out}
.sheet-in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--muted)}
.field input[type=text],.field input[type=date],.field input[type=time],.field select{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card-solid);color:var(--ink);width:100%;min-height:46px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:14px}
.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.toggle{display:flex;gap:10px;align-items:center;font-size:14.5px}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.save{border:0;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:13px;font-size:16px}
.ghost-btn{border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:10px 14px;font-size:15px}
.danger{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:8px 14px;font-size:14px}
.danger.solid{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.08);padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.1)}
.emo-pick{font-size:22px;width:44px;height:44px;padding:0;border-radius:12px;border:1.5px solid var(--line);background:transparent}
.emo-pick[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--pink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-look="notebook" data-hand="round" data-pattern="lines" data-tone="cream">
<div class="shell"><main id="screen"></main></div>
<nav class="nav"><div class="nav-inner" id="nav"></div></nav>
<div id="sheet"></div>

<script>
(function(){
const CFG=window.PITKIT_CONFIG||{};
const DAY=864e5;
const now=()=>new Date();
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=sod(d);x.setDate(x.getDate()+n);return x};
const diffDays=d=>Math.round((sod(d)-sod(now()))/DAY);
const pad=n=>String(n).padStart(2,'0');
const fDate=d=>{d=new Date(d);return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()};
const fShort=d=>{d=new Date(d);return d.getDate()+'.'+(d.getMonth()+1)};
const fDT=d=>{d=new Date(d);return fDate(d)+' · '+pad(d.getHours())+':'+pad(d.getMinutes())};
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const todayKey=()=>dayKey(now());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inDays=n=>n===0?'היום':n===1?'מחר':n===2?'בעוד יומיים':n<0?'עבר המועד':'בעוד '+n+' ימים';

function sanitize(html){
  const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
  const walk=node=>{let out='';node.childNodes.forEach(c=>{
    if(c.nodeType===3){out+=esc(c.textContent);return}
    if(c.nodeType!==1)return;
    const tag=c.tagName;
    if(tag==='BR')out+='<br>';
    else if(tag==='B'||tag==='STRONG'||(c.style&&/bold|[6-9]00/.test(c.style.fontWeight)))out+='<b>'+walk(c)+'</b>';
    else if(tag==='A'&&c.dataset.item)out+=`<a class="ilink" data-item="${parseInt(c.dataset.item,10)}">${esc(c.textContent)}</a>`;
    else if(tag==='DIV'||tag==='P')out+='<br>'+walk(c);
    else out+=walk(c);
  });return out};
  return walk(doc.body.firstChild).replace(/^(<br>)+/,'').replace(/(<br>)+$/,'');
}
function linkOptions(){
  return DRAWERS.map(d=>{const its=items.filter(i=>i.drawer===d.id&&!i.archived);return its.length?`<optgroup label="${esc(d.emoji+' '+d.name)}">${its.map(i=>`<option value="${i.id}">${esc(i.text)}</option>`).join('')}</optgroup>`:''}).join('');
}

let lastRange=null;
document.addEventListener('selectionchange',()=>{
  const ed=document.querySelector('.content[contenteditable="true"]');const s=getSelection();
  if(ed&&s.rangeCount){const r=s.getRangeAt(0);if(ed.contains(r.commonAncestorContainer))lastRange=r.cloneRange()}
});
function restoreRange(ed){
  const cur=getSelection();
  if(cur.rangeCount&&ed.contains(cur.getRangeAt(0).commonAncestorContainer))return;
  ed.focus();const s=getSelection();s.removeAllRanges();
  if(lastRange&&ed.contains(lastRange.commonAncestorContainer))s.addRange(lastRange);
  else{const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);s.addRange(r)}
}
function focusEditor(id){
  const ed=document.getElementById('ed-'+id);if(!ed)return;
  ed.closest('.note').scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  lastRange=null;setTimeout(()=>restoreRange(ed),60);
}
function insertLink(itemId){
  const ed=document.querySelector('.content[contenteditable="true"]');const it=items.find(i=>i.id==itemId);
  if(!ed||!it)return;
  restoreRange(ed);
  const a=document.createElement('a');a.className='ilink';a.dataset.item=it.id;a.contentEditable='false';a.textContent=D(it.drawer).emoji+' '+it.text;
  const r=getSelection().getRangeAt(0);r.deleteContents();
  const sp=document.createTextNode(' ');r.insertNode(sp);r.insertNode(a);r.insertNode(document.createTextNode(' '));
  r.setStartAfter(sp);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);lastRange=r.cloneRange();
}
function goItem(id){
  const it=items.find(i=>i.id==id);if(!it)return;
  const d=D(it.drawer);if(!d)return;
  if(d.type==='capsule'){ui.view='capsule';ui.peek[it.id]=true}
  else{ui.view='drawer';ui.drawer=d.id;ui.confirmDel=false;ui.colorPick=false;if(it.archived)ui.showArchive=true}
  render();
  const el=document.querySelector(`.item[data-id="${it.id}"], .envelope[data-id="${it.id}"]`);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash')}else scrollTo(0,0);
}

function greeting(){const h=now().getHours();return h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב'}
function homeBubble(){
  const lines=[];
  const dl=items.filter(i=>D(i.drawer)?.type==='deadline'&&isOpen(i)).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline))[0];
  if(dl){const n=diffDays(dl.deadline);const r=remindOn(dl);lines.push(`רק מזכירה לך: <b>${esc(dl.text)}</b> עד ${fShort(dl.deadline)}, ${inDays(n)}.${diffDays(r)>0?` אני אזכיר שוב ב־${fShort(r)} 💛`:''}`)}
  const r=items.filter(i=>D(i.drawer)?.type==='routine'&&!isRoutineDone(i)).length;
  if(r) lines.push(`ויש ${r===1?'דבר קטן אחד':r+' דברים קטנים'} לעשות היום. בקצב שלך.`);
  const soon=items.filter(i=>i.drawer==='capsule'&&isOpen(i)&&capsuleVisible(i));
  if(soon.length) lines.push(`נפתח מכתב מקפסולת הזמן: <b>${esc(soon[0].text)}</b> 💌`);
  if(!lines.length) lines.push('הכול רגוע כרגע. אם משהו עולה לך בראש, תכתבי לי ואני אשמור.');
  return lines.map(l=>`<p>${l}</p>`).join('');
}
function drawerPeek(d){
  const open=items.filter(i=>i.drawer===d.id&&isOpen(i));
  if(d.type==='deadline'){const x=open.sort((a,b)=>new Date(a.deadline)-new Date(b.deadline))[0];return x?`הקרוב: עד ${fShort(x.deadline)}`:'אין מה לבטל 🎉'}
  if(d.type==='routine'){if(!open.length)return 'ריק';const left=open.filter(i=>!isRoutineDone(i)).length;return left?`נשאר להיום: ${left}`:'הכול נעשה היום ✓'}
  if(d.type==='capsule'){const x=open.sort((a,b)=>new Date(a.target)-new Date(b.target))[0];return x?`הבא: ${fDate(x.target)}`:'ריקה'}
  return open.length?open.slice(0,3).map(i=>i.text).join(' · '):'ריק';
}

function itemChips(i,d){
  const c=[];
  if(d.type==='deadline'){
    const n=diffDays(i.deadline);
    c.push(`<span class="chip strong">עד ${fDate(i.deadline)} · ${inDays(n)}</span>`);
    c.push(`<span class="chip">🔔 ${fShort(remindOn(i))} (${daysWord(i.before)} לפני)</span>`);
    if(i.early&&diffDays(addDays(i.deadline,-30))>=0) c.push(`<span class="chip">🗓 גם חודש לפני: ${fShort(addDays(i.deadline,-30))}</span>`);
    if(i.nag) c.push(`<span class="chip ghost">🔁 מזכירה כל יום עד שתסמני</span>`);
  }
  if(d.type==='routine'){
    (i.times||[]).forEach(t=>c.push(`<span class="chip when">⏰ ${t}</span>`));
    c.push(`<span class="chip ghost">כל יום</span>`);
    if(i.track) c.push(`<span class="chip">🌱 ${i.streak||0} ימים ברצף</span>`);
  }
  return c.length?`<div class="chips">${c.join('')}</div>`:'';
}
function itemRow(i,d){

  return `<li class="${cls.join(' ')}" data-id="${i.id}" style="--dc:var(${d.color})">
    <button type="button" class="check" data-act="check" data-id="${i.id}" aria-label="${i.done||rdone?'ביטול סימון':'סימון שעשיתי'}: ${esc(i.text)}"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button>

/* ---------- notifications schedule ---------- */
function buildSchedule(){
  const out=[];const N=Date.now();const H=settings.remindTime||'10:00';
  const at=(date,hm)=>{const [h,m]=hm.split(':');const d=new Date(date);d.setHours(+h,+m,0,0);return d.getTime()};
  const add=(t,title,body,id,tag)=>{if(t>N)out.push({at:t,title,body,url:'./?item='+id,tag})};
  for(const i of items){
    if(!isOpen(i))continue;const d=D(i.drawer);if(!d)continue;const title=d.emoji+' '+d.name;
    if(d.type==='deadline'&&i.deadline){
      const dl=new Date(i.deadline),rem=remindOn(i);
      if(i.early)add(at(addDays(dl,-30),H),title,`בעוד חודש, עד ${fShort(dl)}: ${i.text}. יש זמן להתכונן 🌿`,i.id,'e'+i.id);
      add(at(rem,H),title,`היי 💗 ${i.before===0?'היום':'בעוד '+daysWord(i.before)} (עד ${fShort(dl)}): ${i.text}`,i.id,'r'+i.id);
      const last=diffDays(dl);
      if(i.nag){for(let k=1;;k++){const day=addDays(rem,k);const dd=Math.round((day-sod(dl))/DAY);if(dd>3||k>45)break;
        add(at(day,H),title,dd<0?`רק מזכירה שוב: ${i.text} (עד ${fShort(dl)})`:dd===0?`היום היום האחרון: ${i.text} 💗`:`עוד לא סימנת: ${i.text}. אם כבר טיפלת, אפשר לסמן ✓`,i.id,'n'+i.id)}}
      else if(sod(rem)<sod(dl))add(at(dl,H),title,`היום היום האחרון: ${i.text} 💗`,i.id,'d'+i.id);
    }
    if(d.type==='routine'){
      for(let k=0;k<21;k++){const day=addDays(now(),k);if(k===0&&isRoutineDone(i))continue;
        for(const t of i.times||[])add(at(day,t),title,`הגיע הזמן: ${i.text} 💗`,i.id,'t'+i.id)}
    }
    if(d.type==='capsule'&&i.target){
      add(at(addDays(i.target,-30),H),'💌 נפתח מכתב מקפסולת הזמן',`ל־${fDate(i.target)}: ${i.text}`,i.id,'c'+i.id);
      add(at(i.target,H),'💌 היום זה היום',i.text,i.id,'C'+i.id);
    }
  }
  return out.sort((a,b)=>a.at-b.at).slice(0,700);
}
let syncTimer=null;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500)}
async function syncNow(){
  if(!CFG.pushUrl||!push.subscription)return;
  try{
    const r=await fetch(CFG.pushUrl.replace(/\/$/,'')+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:push.device,subscription:push.subscription,schedule:buildSchedule()})});
    if(!r.ok)throw new Error('שגיאה '+r.status);
    push.lastSync=iso(now());push.lastError=null;
  }catch(e){push.lastError='לא הצלחתי לעדכן את השרת. אנסה שוב בפעם הבאה שתפתחי.'}
  persist();if(ui.view==='settings')render();
}
const b64ToBytes=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function enablePush(){
  ui.msg=null;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ui.msg='לא אישרת התראות. אפשר לנסות שוב מתי שתרצי.';render();return}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(CFG.vapidPublic)});
    push.subscription=sub.toJSON();persist();
    await syncNow();ui.msg='מעולה! מעכשיו התזכורות יגיעו לטלפון 💗';
  }catch(e){ui.msg='משהו לא הסתדר בהפעלה: '+e.message}
  render();
}
async function testPush(){

    const j=await r.json();ui.msg=j.ok?'נשלחה התראת ניסיון. היא אמורה להגיע תוך כמה שניות.':'השליחה לא הצליחה ('+(j.status||j.error)+'). אולי צריך להפעיל התראות מחדש.';
    if(!j.ok&&(j.status===404||j.status===410)){push.subscription=null;persist()}
  }catch(e){ui.msg='לא הצלחתי להגיע לשרת.'}
  render();
}

/* ---------- interactions ---------- */
function sparkle(btn){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=btn.getBoundingClientRect();const set=['💗','✨','💕','🌸','💖'];
  for(let k=0;k<9;k++){const s=document.createElement('span');s.className='spark';s.textContent=set[k%set.length];
    const a=Math.random()*Math.PI*2,dist=40+Math.random()*40;
    s.style.left=(r.left+r.width/2-8)+'px';s.style.top=(r.top+r.height/2-10)+'px';
    s.style.setProperty('--dx',Math.cos(a)*dist+'px');s.style.setProperty('--dy',Math.sin(a)*dist-20+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),950)}
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
}
function check(id,btn){
  const i=items.find(x=>x.id==id);const d=D(i.drawer);const row=btn.closest('.item,.envelope');
  if(d.type==='routine'){
    if(isRoutineDone(i)){i.doneDate=null;i.lastDone=i.prevLastDone||null;i.streak=i.prevStreak||0;save();render();return}
    row.classList.add('popping');sparkle(btn);
    setTimeout(()=>{const y=dayKey(addDays(now(),-1));i.prevLastDone=i.lastDone||null;i.prevStreak=i.streak||0;i.streak=(i.lastDone===y?(i.streak||0):0)+1;i.lastDone=todayKey();i.doneDate=todayKey();save();render()},600);return;
  }
  if(i.done){i.done=false;i.archived=false;i.doneAt=null;save();render();return}
  row.classList.add('popping');sparkle(btn);
  setTimeout(()=>{i.done=true;i.doneAt=iso(now());save();render()},650);
}

function closeEditor(keep){
  const n=notes.find(x=>x.id===ui.editNote);
  if(n){if(keep){const ed=document.getElementById('ed-'+n.id);if(ed)n.html=sanitize(ed.innerHTML)}if(!n.html.replace(/<br>|&nbsp;|\s/g,''))notes=notes.filter(x=>x!==n)}
  ui.editNote=null;ui.draft=null;persist();render();
}
let pendingImport=null;
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-act="bold"]'))e.preventDefault()});
document.addEventListener('change',async e=>{
  if(e.target.id==='linkpick'&&e.target.value){insertLink(e.target.value);e.target.value='';return}
  if(e.target.id==='f-remindTime'){settings.remindTime=e.target.value||'10:00';save();return}
  if(e.target.id==='importFile'&&e.target.files[0]){
    try{const j=JSON.parse(await e.target.files[0].text());if(j.app!=='pitkit'||!Array.isArray(j.items))throw 0;pendingImport=j;ui.confirmImport=true;ui.msg=null}
    catch(err){ui.msg='הקובץ הזה לא נראה כמו גיבוי של פתקית.'}
    render();return;
  }
  if(ui.sheet&&e.target.closest('.sheet'))readSheet();
});
document.addEventListener('input',e=>{if(ui.sheet&&e.target.closest('.sheet'))readSheet()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.sheet){ui.sheet=null;renderSheet()}
  if(e.key==='Enter'&&e.target.id==='f-text'){e.preventDefault();saveItem()}
  if(e.key==='Enter'&&e.target.id==='f-dname'){e.preventDefault();saveDrawer()}
});
document.addEventListener('click',e=>{
  const lk=e.target.closest('.ilink');
  if(lk&&!lk.closest('[contenteditable="true"]')){e.preventDefault();goItem(lk.dataset.item);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='look'){settings.look=b.dataset.v;persist();applyLook();render();return}
  if(a==='hand'){settings.hand=b.dataset.v;persist();applyLook();render();return}
  if(a==='pattern'){settings.paper.pattern=b.dataset.v;persist();applyLook();render();return}
  if(a==='tone'){settings.paper.tone=b.dataset.v;persist();applyLook();render();return}
  if(a==='enablePush'){enablePush();return}
  if(a==='testPush'){testPush();return}
  if(a==='syncNow'){syncNow().then(()=>{ui.msg=push.lastError||'עודכן 💗';render()});return}
  if(a==='export'){exportBackup();return}
  if(a==='doImport'&&pendingImport){const j=pendingImport;items=j.items;notes=j.notes||[];custom=j.custom||[];drawerColors=j.drawerColors||{};settings=Object.assign({},DEFAULTS,j.settings||{});syncDrawers();pendingImport=null;ui.confirmImport=null;ui.msg='הגיבוי שוחזר 💗';save();applyLook();render();return}
  if(a==='cancelImport'){pendingImport=null;ui.confirmImport=null;render();return}
  if(a==='colorPick'){ui.colorPick=!ui.colorPick;render();return}
  if(a==='setColor'){drawerColors[ui.drawer]=b.dataset.v;syncDrawers();persist();render();return}
  if(a==='addNote'){if(ui.editNote!=null)closeEditor(true);const id=nextId(notes);notes.push({id,scope:b.dataset.scope,html:'',created:iso(now())});ui.editNote=id;ui.draft=null;render();focusEditor(id);return}
  if(a==='editNote'){if(ui.editNote!=null)closeEditor(true);ui.editNote=+b.dataset.id;ui.draft=null;ui.confirmNote=null;render();focusEditor(ui.editNote);return}
  if(a==='bold'){const ed=document.querySelector('.content[contenteditable="true"]');if(ed){restoreRange(ed);document.execCommand('bold')}return}
  if(a==='saveNote'){closeEditor(true);return}
  if(a==='cancelNote'){closeEditor(false);return}
  if(a==='moveNote'){const n=notes.find(x=>x.id==b.dataset.id);const list=notes.filter(x=>x.scope===n.scope);const k=list.indexOf(n),j=k+(+b.dataset.dir);if(j<0||j>=list.length)return;const ia=notes.indexOf(n),ib=notes.indexOf(list[j]);[notes[ia],notes[ib]]=[notes[ib],notes[ia]];persist();render();document.querySelector(`[data-note="${n.id}"]`)?.scrollIntoView({inline:'center',block:'nearest'});return}
  if(a==='askDelNote'){ui.confirmNote=+b.dataset.id;render();return}
  if(a==='keepNote'){ui.confirmNote=null;render();return}
  if(a==='delNote'){notes=notes.filter(x=>x.id!=b.dataset.id);ui.confirmNote=null;persist();render();return}
  if(a==='home'){ui.view='home';render();scrollTo(0,0);return}
  if(a==='nav'){ui.view=b.dataset.view;ui.msg=null;render();scrollTo(0,0);return}
  if(a==='drawer'){const id=b.dataset.id;if(id==='capsule'){ui.view='capsule'}else{ui.view='drawer';ui.drawer=id;ui.showArchive=false;ui.confirmDel=false;ui.colorPick=false}render();scrollTo(0,0);return}
  if(a==='check'){check(b.dataset.id,b);return}
  if(a==='love'){const i=items.find(x=>x.id==b.dataset.id);i.love=!i.love;persist();render();return}
  if(a==='editItem'){openSheet(items.find(x=>x.id==b.dataset.id));return}
  if(a==='askDeleteItem'){ui.sheet.confirmDelete=true;readSheet();renderSheet();return}
  if(a==='keepItem'){ui.sheet.confirmDelete=false;renderSheet();return}
  if(a==='deleteItem'){items=items.filter(i=>i.id!==ui.sheet.editId);ui.sheet=null;save();render();renderSheet();return}
  if(a==='again'){items.push({id:nextId(items),drawer:ui.drawer,text:b.dataset.text,created:iso(now()),done:false,archived:false,love:false});save();render();return}
  if(a==='archive'){items.forEach(i=>{if(i.drawer===ui.drawer&&i.done)i.archived=true});persist();render();return}
  if(a==='toggleArch'){ui.showArchive=!ui.showArchive;render();return}
  if(a==='peek'){ui.peek[b.dataset.id]=!ui.peek[b.dataset.id];render();return}
  if(a==='month'){ui.highlight=b.dataset.key;render();document.getElementById('m-'+b.dataset.key)?.scrollIntoView({behavior:'smooth',block:'center'});return}
  if(a==='add'){openSheet();return}
  if(a==='close'){ui.sheet=null;renderSheet();return}
  if(a==='sheetDrawer'){readSheet();ui.sheet.drawer=b.dataset.id;renderSheet();return}
  if(a==='saveItem'){saveItem();return}
  if(a==='newDrawer'){ui.sheet={kind:'drawer',name:'',emoji:'🎁',color:'--c1',type:'list'};renderSheet();return}
  if(a==='pickEmoji'||a==='pickColor'||a==='pickType'){readSheet();ui.sheet[{pickEmoji:'emoji',pickColor:'color',pickType:'type'}[a]]=b.dataset.v;renderSheet();return}
  if(a==='saveDrawer'){saveDrawer();return}
  if(a==='askDel'){ui.confirmDel=true;render();return}
  if(a==='cancelDel'){ui.confirmDel=false;render();return}
  if(a==='delDrawer'){const id=ui.drawer;custom=custom.filter(c=>c.id!==id);items=items.filter(i=>i.drawer!==id);notes=notes.filter(n=>n.scope!==id);delete drawerColors[id];syncDrawers();ui.confirmDel=false;ui.view='home';save();render();scrollTo(0,0);return}
});

function applyLook(){
  const b=document.body;
  b.dataset.look=settings.look;b.dataset.hand=settings.hand;b.dataset.pattern=settings.paper.pattern;b.dataset.tone=settings.paper.tone;
  const bar=getComputedStyle(b).getPropertyValue('--bar').trim()||'#fbf6e8';
  document.querySelector('meta[name="theme-color"]').setAttribute('content',bar);
}
function render(){
  liveDraft();
  const v=ui.view;
  document.getElementById('screen').innerHTML=v==='drawer'?renderDrawer():v==='capsule'?renderCapsule():v==='fav'?renderFav():v==='settings'?renderSettings():renderHome();
  const cur=v==='drawer'||v==='fav'?'home':v;
  document.getElementById('nav').innerHTML=`
    <button type="button" data-act="nav" data-view="home" ${cur==='home'?'aria-current="page"':''}>🏠 נושאים</button>
    <button type="button" data-act="nav" data-view="capsule" ${cur==='capsule'?'aria-current="page"':''}>💌 קפסולה</button>
    <button type="button" class="add" data-act="add" aria-label="פתק חדש">+</button>
    <button type="button" data-act="nav" data-view="settings" ${cur==='settings'?'aria-current="page"':''}>⚙️ הגדרות</button>`;
}
function openFromUrl(u){
  try{const id=new URL(u,location.href).searchParams.get('item');if(id){history.replaceState(null,'',location.pathname);setTimeout(()=>goItem(+id),50)}}catch(e){}
}

window.__pitkit={buildSchedule}; // for debugging from the console
applyLook();render();
openFromUrl(location.href);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='open')openFromUrl(e.data.url)});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!ui.sheet&&ui.editNote==null)render();scheduleSync()}});
scheduleSync();
})();
</script>
</body>
</html>
